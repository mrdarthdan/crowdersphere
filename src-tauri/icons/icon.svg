<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <!-- CrowderSphere app icon: desert sunset, aperture sun, pen nib. Drawn at 256 units; scales to any size. -->
  <defs>
