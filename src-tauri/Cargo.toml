[package]
name = "crowdersphere"
version = "2.2.0"
description = "Write WordPress posts on your computer and send them to your blog"
authors = ["Daniel Crowder"]
license = "MIT"
repository = "https://github.com/mrdarthdan/crowdersphere"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crowdersphere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
trash = "5"
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
regex = "1"
dirs = "5"
html-escape = "0.2"
urlencoding = "2"
unicode-normalization = "0.1"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
