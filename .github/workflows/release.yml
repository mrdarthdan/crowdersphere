# Builds CrowderSphere installers and attaches them to a draft GitHub Release.
#
# To release: bump the version in src-tauri/Cargo.toml, commit, then push a matching tag:
#   git tag v1.7.0 && git push origin v1.7.0
# Review the draft release on GitHub, then click Publish.
#
# Signing is optional and switches on by itself when its secrets exist (see SIGNING.md):
#   Windows: Azure Artifact Signing (AZURE_*) or SignPath (SIGNPATH_*)
#   macOS:   Apple Developer ID + notarization (APPLE_*)
# Automatic updates need the update signing key (TAURI_SIGNING_PRIVATE_KEY and _PASSWORD); with it,
# each release also gets latest.json and .sig files that installed copies use to update themselves.
# Without them the installers are built unsigned, exactly like the Build workflow.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version $v in src-tauri/Cargo.toml"; exit 1
          fi

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # ---- Update files (latest.json + .sig), signed with the update key
      - name: Set up update signing
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: |
          echo '{ "bundle": { "createUpdaterArtifacts": true } }' > src-tauri/tauri.updater.conf.json
          echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      # ---- Windows signing with Azure Artifact Signing (formerly Trusted Signing)
      - name: Set up Azure Artifact Signing
        if: matrix.name == 'windows' && env.HAS_AZURE == 'true'
        shell: bash
        run: |
          cargo install trusted-signing-cli --locked
          cat > src-tauri/tauri.signing.conf.json <<EOF
          { "bundle": { "windows": { "signCommand":
            "trusted-signing-cli -e ${{ secrets.AZURE_SIGNING_ENDPOINT }} -a ${{ secrets.AZURE_SIGNING_ACCOUNT }} -c ${{ secrets.AZURE_SIGNING_PROFILE }} -d CrowderSphere %1" } } }
          EOF
          echo "SIGN_ARGS=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_ENV"

      # ---- macOS signing + notarization (Tauri does this itself when these are set)
      - name: Set up Apple signing
        if: matrix.name == 'macos' && env.HAS_APPLE == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }} ${{ env.UPDATER_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseName: CrowderSphere ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            CrowderSphere is a desktop editor for writing WordPress posts. Write with formatting and pictures, keep every post as a folder on your computer, export to Word, and send posts to your blog as drafts, published or scheduled. See the [README](https://github.com/mrdarthdan/crowdersphere#readme) for everything it does.

            **Download the installer for your computer below:**
            - **Windows 10/11:** `CrowderSphere_*_x64-setup.exe`
            - **Mac (Intel and Apple silicon):** `CrowderSphere_*_universal.dmg`. First time: right-click the app and choose Open.
            - **Linux:** `.AppImage`, `.deb` or `.rpm`

            Your posts and WordPress connection are kept when you update. To uninstall on Windows, use Settings → Apps → Installed apps.

            [Code signing policy](https://github.com/mrdarthdan/crowdersphere#code-signing-policy) · [Privacy](https://github.com/mrdarthdan/crowdersphere#privacy)
          releaseDraft: true
          prerelease: false

      # ---- Windows signing with SignPath (free for qualifying open-source projects)
      - name: Collect the unsigned Windows installer for SignPath
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_AZURE != 'true'
        shell: bash
        run: |
          mkdir unsigned
          cp src-tauri/target/release/bundle/nsis/*.exe unsigned/
          echo "APP_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"
      - name: Upload unsigned installer
        id: unsigned
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_AZURE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: unsigned/
      - name: Sign with SignPath
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_AZURE != 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: crowdersphere
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.APP_VERSION }}"
          wait-for-completion: true
          # each request is approved by hand in SignPath, so allow time for that
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Replace the release installer with the signed one
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_AZURE != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$APP_VERSION" signed/*.exe --clobber
      # The update signature was made for the unsigned installer; sign the SignPath-signed one again
      # and point latest.json at the new signature, or installed copies would reject the update.
      - name: Re-sign the update for the signed installer
        if: matrix.name == 'windows' && env.HAS_SIGNPATH == 'true' && env.HAS_AZURE != 'true' && env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          exe=$(ls signed/*.exe | head -1)
          npx --yes @tauri-apps/cli@^2 signer sign "$exe"
          gh release upload "v$APP_VERSION" "$exe.sig" --clobber
          gh release download "v$APP_VERSION" -p latest.json -D upd
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('upd/latest.json'));const sig=fs.readFileSync(process.argv[1],'utf8').trim();for(const k of Object.keys(j.platforms))if(k.startsWith('windows'))j.platforms[k].signature=sig;fs.writeFileSync('upd/latest.json',JSON.stringify(j,null,2));" "$exe.sig"
          gh release upload "v$APP_VERSION" upd/latest.json --clobber
