# Keeps src-tauri/Cargo.lock committed, so every build (and every signed release) uses the
# exact same library versions. Runs when Cargo.toml changes.
name: Cargo.lock

on:
  push:
    paths:
      - "src-tauri/Cargo.toml"
      - ".github/workflows/lockfile.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update Cargo.lock
        run: |
          if [ -f src-tauri/Cargo.lock ]; then cargo fetch --manifest-path src-tauri/Cargo.toml; else cargo generate-lockfile --manifest-path src-tauri/Cargo.toml; fi
      - name: Commit Cargo.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then echo "Cargo.lock unchanged"; exit 0; fi
          git commit -m "Update src-tauri/Cargo.lock"
          git push
