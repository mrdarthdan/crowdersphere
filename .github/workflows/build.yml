name: Build

on:
  push:
    branches: [main, tauri-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    runs-on: ubuntu-latest
    name: editor (browser test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser test of the editor
        working-directory: dev
        run: |
          npm init -y > /dev/null
          npm install --no-save playwright@1
          node editor-test.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check formatting
        if: matrix.name == 'linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        if: matrix.name == 'linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build app and installers
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CrowderSphere-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
