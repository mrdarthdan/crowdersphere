<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CrowderSphere</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<style>
:root{
  --bg:#f4f3f0; --panel:#fbfaf8; --line:#e2dfd9; --ink:#1d1d1f; --muted:#6b6862; --soft:#ece9e3;
  --accent:#2f5bd3; --accent-ink:#fff; --accent-soft:#e6ecfb; --ok:#1f7a4d; --warn:#a15c00; --bad:#b42318;
  --paper:#fff; --shadow:0 8px 30px rgba(20,20,30,.14);
  --text:#222; --quote:#444; --code-bg:#f5f5f3; --placeholder:#aaa; --link:#2f5bd3;
  --ok-soft:#e1f3ea; --warn-soft:#fbefdc; --editor-font:Georgia,"Times New Roman",serif; --editor-size:18px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#141518; --panel:#1b1d21; --line:#2f3238; --ink:#e7e7e9; --muted:#9a9ca4; --soft:#292c32;
  --accent:#4f74ea; --accent-ink:#fff; --accent-soft:#263252; --ok:#4cc38a; --warn:#e5a540; --bad:#ff6b5e;
  --paper:#1f2125; --shadow:0 8px 30px rgba(0,0,0,.5);
  --text:#e4e4e6; --quote:#c3c3c8; --code-bg:#2a2c31; --placeholder:#666a72; --link:#8ea8ff;
  --ok-soft:#1b3428; --warn-soft:#3b2d16;
  color-scheme:dark;
}
:root[data-theme=dark] #imgbar{border:1px solid #3a3e47}
:root[data-theme=dark] #editor figure img{filter:brightness(.95)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:6px 12px}
button:hover{background:var(--soft)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.danger{color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--soft)}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=url],input[type=password],input[type=number],input[type=datetime-local],textarea,select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--paper);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.field{display:block;margin:0 0 12px}
label.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

#app{display:grid;grid-template-columns:clamp(200px,17vw,280px) minmax(0,1fr) auto;height:100vh}

/* sidebar */
#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 10px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px;color:var(--accent)}
#newPost{margin:0 14px 10px}
#search{margin:0 14px 8px;width:auto}
#postList{flex:1;overflow:auto;padding:4px 8px}
.post-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.post-item:hover{background:var(--soft)}
.post-item.active{background:var(--accent-soft)}
.post-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-item .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:600}
.badge.publish{background:var(--ok-soft);color:var(--ok)}
.badge.draft,.badge.pending{background:var(--warn-soft);color:var(--warn)}
.badge.changed{background:var(--accent-soft);color:var(--accent)}
.badge.future{background:var(--accent-soft);color:var(--accent)}
.sched-pick{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sched-pick input[type=datetime-local]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--paper);color:inherit;font:inherit;color-scheme:light dark}
.sched-pick .quick{font-size:12px;padding:4px 8px}
.empty-list{color:var(--muted);padding:16px 10px;font-size:13px}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px}
.side-foot button{flex:1;font-size:13px}

/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#title{flex:1;min-width:120px;font-size:20px;font-weight:700;border:none;background:transparent;padding:6px 4px;font-family:var(--editor-font)}
#title:focus{outline:none;border:none;background:var(--paper);border-radius:6px}
#saveState{font-size:12px;color:var(--muted);white-space:nowrap;min-width:110px;text-align:right}
#saveState.err{color:var(--bad);font-weight:600}

#toolbar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
#toolbar button{border:none;background:transparent;padding:4px;border-radius:6px;min-width:28px;height:32px;display:inline-flex;align-items:center;justify-content:center}
#toolbar button:hover{background:var(--soft)}
#toolbar button.on{background:var(--accent-soft);color:var(--accent)}
#toolbar svg{width:18px;height:18px}
#toolbar select{width:auto;padding:4px 6px;height:32px}
#toolbar .txt{font-weight:700;font-family:Georgia,serif;font-size:16px}
#toolbar.source-mode button:not(#btnSource),#toolbar.source-mode select{opacity:.35;pointer-events:none}

#editorWrap{flex:1;overflow:auto;background:var(--bg);padding:clamp(12px,2vw,28px) clamp(10px,2.2vw,32px) 80px;position:relative}
#editor,#source{max-width:var(--page-width,none);margin:0 auto;background:var(--paper);min-height:100%;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
#editor{zoom:var(--zoom,1);padding:clamp(24px,3.5vw,48px) clamp(20px,5vw,80px);outline:none;font-family:var(--editor-font);font-size:var(--editor-size);line-height:1.7;color:var(--text)}
#editor::after{content:"";display:block;clear:both}
#editor:empty::before,#editor.is-empty::before{content:"Start writing your post...";color:var(--placeholder);position:absolute}
#source{zoom:var(--zoom,1);display:block;width:100%;padding:24px;font:13px/1.55 Consolas,"Cascadia Mono",monospace;border:none;resize:none;min-height:70vh;color:var(--text)}
#editor h2{font-size:1.6em;line-height:1.25;margin:1.2em 0 .5em}
#editor h3{font-size:1.3em;margin:1.1em 0 .4em}
#editor h4{font-size:1.1em;margin:1em 0 .4em}
#editor p{margin:0 0 1em}
#editor blockquote{margin:1em 0;padding:.2em 1.2em;border-left:4px solid var(--accent);color:var(--quote);font-style:italic}
#editor pre{background:var(--code-bg);padding:12px 14px;border-radius:6px;font:14px/1.5 Consolas,monospace;white-space:pre-wrap}
#editor a{color:var(--link)}
#editor hr{border:none;border-top:2px solid var(--line);margin:2em 0}
#editor ul,#editor ol{padding-left:1.6em;margin:0 0 1em}
#editor table{border-collapse:collapse;margin:1em 0}
#editor td,#editor th{border:1px solid var(--line);padding:4px 8px}
#editor img{max-width:100%;height:auto}

/* images (WordPress alignment classes) */
#editor figure{margin:.4em 0 1em;position:relative;cursor:pointer;user-select:none}
#editor figure img{display:block;width:100%;height:auto;border-radius:2px}
#editor figure figcaption{font:13px/1.4 "Segoe UI",sans-serif;color:var(--muted);text-align:center;margin-top:6px}
#editor figure.alignleft{float:left;margin:.3em 1.4em 1em 0}
#editor figure.alignright{float:right;margin:.3em 0 1em 1.4em}
#editor figure.aligncenter{margin-left:auto;margin-right:auto;clear:both}
#editor figure.alignnone{clear:both}
#editor figure:hover{outline:2px dashed #b9c6ee;outline-offset:3px}
#editor figure.is-selected{outline:3px solid var(--accent);outline-offset:3px}
#editor figure.is-featured::before{content:"\2605 Featured";position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font:600 11px "Segoe UI",sans-serif;padding:2px 8px;border-radius:99px;z-index:1}

#statusbar{display:flex;justify-content:space-between;gap:12px;padding:5px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel)}
#statusbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#statusbar{align-items:center}
#folderInfo{flex:1;text-align:right;min-width:0}
.zoomctl{display:inline-flex;align-items:center;gap:2px;flex:none;overflow:visible!important}
.zoomctl button{border:none;background:transparent;padding:0 6px;height:20px;font-size:13px;line-height:1;color:var(--muted);border-radius:5px}
.zoomctl button:hover{background:var(--soft);color:var(--ink)}
.zoomctl #zoomReset{min-width:48px;font-size:12px;font-variant-numeric:tabular-nums}
#source[hidden],#editor[hidden]{display:none!important}
#topbar button{white-space:nowrap}
#panelClose{display:none;float:right;margin:-6px -6px 0 0;font-size:13px;padding:3px 8px}
@media (max-width:1000px){
  #panel{position:fixed;right:0;top:0;bottom:0;z-index:40;box-shadow:var(--shadow)}
  #panelClose{display:block}
  #folderInfo{display:none}
}

/* right panel */
#panel{width:clamp(250px,19vw,320px);background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px}
#panel.hidden{display:none}
#panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
#panel h3:first-child{margin-top:0}
#catList{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:6px 8px}
#catList label{display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer}
#catList .child{padding-left:18px}
.row{display:flex;gap:6px;align-items:center}
.row>input{flex:1}
#featuredBox{border:1px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted);background:var(--paper)}
#featuredBox img{width:100%;border-radius:4px;display:block;margin-bottom:6px}
#featuredBox.dragover{border-color:var(--accent);background:var(--accent-soft)}
#featuredBox .fb-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#featuredBox .fb-btns button{font-size:12px;padding:4px 10px}
#featuredBox .fb-note{margin:4px 0 2px}
.wp-status{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
.wp-status a{color:var(--link);cursor:pointer;text-decoration:underline}
.small-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.small-btns button{font-size:12px;padding:4px 9px}

/* floating image toolbar */
#imgbar{position:fixed;z-index:50;background:#1f2330;color:#fff;border-radius:10px;padding:5px;display:flex;gap:2px;align-items:center;box-shadow:var(--shadow);flex-wrap:nowrap}
#imgbar[hidden]{display:none}
#imgbar button{background:transparent;border:none;color:#fff;padding:5px 8px;border-radius:6px;font-size:12px;height:30px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#imgbar button:hover{background:rgba(255,255,255,.14)}
#imgbar button.on{background:rgba(255,255,255,.24)}
#imgbar svg{width:16px;height:16px}
#imgbar .sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px}
#imgbar input[type=range]{width:90px;accent-color:#8fa8ff}
#imgbar .wlabel{font-size:11px;width:34px;text-align:right;opacity:.8}

/* modal + toasts */
#modalBack{position:fixed;inset:0;background:rgba(20,20,30,.38);display:flex;align-items:center;justify-content:center;z-index:100}
#modalBack[hidden]{display:none}
.modal{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);width:min(560px,92vw);max-height:90vh;display:flex;flex-direction:column}
.modal.wide{width:min(980px,95vw);height:90vh}
.modal header{padding:16px 20px 0;font-size:17px;font-weight:700}
.modal .body{padding:14px 20px;overflow:auto;flex:1}
.modal footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
.modal iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio b{display:block}
.radio small{color:var(--muted)}
.check-list{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.check-list li{padding:2px 0}
.check-list .warn{color:var(--warn)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.result-ok{color:var(--ok);font-weight:600}
.result-bad{color:var(--bad);font-weight:600}
ol.steps{padding-left:20px;margin:6px 0;font-size:13px;color:var(--muted)}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{background:#1f2330;color:#fff;padding:9px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:13px;max-width:70vw}
.toast.error{background:var(--bad)}
.toast.ok{background:var(--ok)}
#toolbar select#fontPick{width:122px}
#toolbar select#blockType{width:112px}
.side-foot #themeBtn{flex:0 0 38px;padding:6px 0}
.side-foot #themeBtn svg{width:16px;height:16px;vertical-align:-3px}
#wordCount{cursor:pointer}
#wordCount:hover{color:var(--ink);text-decoration:underline}
#selCount{color:var(--accent);font-weight:600}
.prefs-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px;border-top:1px solid var(--line);padding-top:14px}
.stats{width:100%;border-collapse:collapse;font-size:14px}
.stats td{padding:6px 4px;border-bottom:1px solid var(--line)}
.stats td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#dropHint{position:absolute;inset:10px;border:3px dashed var(--accent);border-radius:14px;background:rgba(47,91,211,.07);display:none;align-items:center;justify-content:center;font-size:18px;color:var(--accent);font-weight:600;pointer-events:none;z-index:5}
#editorWrap.dragging #dropHint{display:flex}
</style>
</head>

<script src="/docx.js"></script>
<script>
"use strict";
const TOKEN = "__API_TOKEN__";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const editor = $('#editor'), source = $('#source'), titleEl = $('#title');

const state = {
  posts: [], postsDir: '', current: null, dirty: false, saving: null, pendingSave: false,
  settings: null, categories: null, selFig: null, sourceMode: false, savedRange: null
};

/* ------------------------------------------------------------------ preferences (theme, fonts, spelling) */
const FONTS = [
  ['Georgia', 'Georgia, "Times New Roman", serif'],
  ['Cambria', 'Cambria, Georgia, serif'],
  ['Times New Roman', '"Times New Roman", Times, serif'],
  ['Palatino', '"Palatino Linotype", "Book Antiqua", Palatino, serif'],
  ['Garamond', 'Garamond, "EB Garamond", Georgia, serif'],
  ['Segoe UI', '"Segoe UI", system-ui, sans-serif'],
  ['Calibri', 'Calibri, Carlito, "Segoe UI", sans-serif'],
  ['Arial', 'Arial, Helvetica, sans-serif'],
  ['Verdana', 'Verdana, Geneva, sans-serif'],
  ['Trebuchet MS', '"Trebuchet MS", Helvetica, sans-serif'],
  ['Courier New', '"Courier New", Courier, monospace'],
  ['Consolas', 'Consolas, "Courier New", monospace']
];
const DEFAULT_PREFS = { theme: 'light', font: 'Georgia', fontSize: 18, spellcheck: true, exportFont: true, zoom: 1, pageWidth: 'fill' };
const PAGE_WIDTHS = { fill: 'none', wide: '1100px', reading: '780px' };
let prefs = Object.assign({}, DEFAULT_PREFS, (() => { try { return JSON.parse(localStorage.getItem('bw-prefs') || '{}'); } catch (e) { return {}; } })());
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function fontStack(name) { const f = FONTS.find(f => f[0] === name); return f ? f[1] : FONTS[0][1]; }
function firstFamily(stack) { return String(stack || '').split(',')[0].replace(/["']/g, '').trim(); }
function isDark() { return prefs.theme === 'dark' || (prefs.theme === 'system' && darkMQ.matches); }
function applyPrefs() {
  const root = document.documentElement;
  root.dataset.theme = isDark() ? 'dark' : 'light';
  root.style.setProperty('--editor-font', fontStack(prefs.font));
  root.style.setProperty('--editor-size', (+prefs.fontSize || 18) + 'px');
  root.style.setProperty('--zoom', String(+prefs.zoom || 1));
  root.style.setProperty('--page-width', PAGE_WIDTHS[prefs.pageWidth] || 'none');
  const zr = $('#zoomReset'); if (zr) zr.textContent = Math.round((+prefs.zoom || 1) * 100) + '%';
  if (typeof positionImgbar === 'function') requestAnimationFrame(positionImgbar);
  for (const el of [editor, titleEl, $('#excerpt'), $('#tags')]) el.spellcheck = !!prefs.spellcheck;
  $('#btnSpell').classList.toggle('on', !!prefs.spellcheck);
  $('#themeBtn use').setAttribute('href', isDark() ? '#i-sun' : '#i-moon');
  $('#themeBtn').title = isDark() ? 'Switch to light mode' : 'Switch to dark mode';
}
function cachePrefs() { try { localStorage.setItem('bw-prefs', JSON.stringify(prefs)); } catch (e) {} }
async function savePrefs(change) {
  prefs = Object.assign({}, prefs, change);
  cachePrefs(); applyPrefs();
  try { state.settings = await api('/api/settings', { json: { prefs } }); }
  catch (e) { toast('Couldn\'t save that setting: ' + e.message, 'error'); }
}
darkMQ.addEventListener('change', () => { if (prefs.theme === 'system') applyPrefs(); });
let zoomSaveTimer = null, wheelAcc = 0;
function setZoom(z) {
  z = Math.min(2.5, Math.max(0.5, Math.round(z * 10) / 10));
  if (z === prefs.zoom) return;
  prefs.zoom = z; cachePrefs(); applyPrefs();
  clearTimeout(zoomSaveTimer);
  zoomSaveTimer = setTimeout(() => savePrefs({ zoom: prefs.zoom }), 700);
}
$('#zoomIn').addEventListener('click', () => setZoom((+prefs.zoom || 1) + 0.1));
$('#zoomOut').addEventListener('click', () => setZoom((+prefs.zoom || 1) - 0.1));
$('#zoomReset').addEventListener('click', () => setZoom(1));
$('#editorWrap').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 40) { setZoom((+prefs.zoom || 1) + (wheelAcc < 0 ? 0.1 : -0.1)); wheelAcc = 0; }
}, { passive: false });
document.addEventListener('keydown', e => {
  if (!e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === '=' || e.key === '+' || e.code === 'NumpadAdd') { e.preventDefault(); setZoom((+prefs.zoom || 1) + 0.1); }
  else if (e.key === '-' || e.code === 'NumpadSubtract') { e.preventDefault(); setZoom((+prefs.zoom || 1) - 0.1); }
  else if (e.key === '0' || e.code === 'Numpad0') { e.preventDefault(); setZoom(1); }
});
applyPrefs();

/* ------------------------------------------------------------------ utils */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return iso;
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Today ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  return d.toLocaleDateString([], {month:'short', day:'numeric', year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric'});
}
function fmtWhen(iso) {   // full date + time, for scheduled posts
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return iso;
  return d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric', hour: 'numeric', minute: '2-digit' });
}
function toLocalInput(d) {  // Date -> value for <input type="datetime-local">
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
}
function defaultScheduleTime() {  // tomorrow at 8:00 AM
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(8, 0, 0, 0); return d;
}
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), kind === 'error' ? 7000 : 3200);
}
async function api(path, opts = {}) {
  const init = { method: opts.method || (opts.json !== undefined || opts.body !== undefined ? 'POST' : 'GET'), headers: { 'X-Token': TOKEN } };
  if (opts.json !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.json); }
  else if (opts.body !== undefined) init.body = opts.body;
  if (opts.keepalive) init.keepalive = true;
  let res;
  try { res = await fetch(path, init); }
  catch (e) { throw new Error('CrowderSphere\'s background service isn\'t responding. Close this window and start CrowderSphere again.'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || (data && data.error)) throw new Error((data && data.error) || ('Request failed (HTTP ' + res.status + ')'));
  return data;
}
function blankMeta() { return { title:'', excerpt:'', categories:[], tags:'', featured:'', wpId:null, wpLink:'', wpStatus:'', published:'', scheduled:'', modified:'', created:'', media:{} }; }
function fileUrl(rel) { return '/files/' + encodeURIComponent(state.current.id) + '/' + rel; }

/* ------------------------------------------------------------------ modal */
function openModal({ title, body, buttons = [], wide = false, onOpen, onClose }) {
  const back = $('#modalBack');
  back.innerHTML = '';
  const m = document.createElement('div');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = `<header>${esc(title)}</header><div class="body"></div><footer></footer>`;
  const b = $('.body', m);
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.appendChild(body);
  const close = () => { back.hidden = true; back.innerHTML = ''; document.removeEventListener('keydown', onKey); if (onClose) onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  for (const btn of buttons) {
    const el = document.createElement('button');
    el.textContent = btn.label;
    if (btn.primary) el.className = 'primary';
    if (btn.danger) el.className = 'danger';
    if (btn.id) el.id = btn.id;
    el.onclick = async () => { if (btn.action) { const r = await btn.action(m, el); if (r === false) return; } close(); };
    $('footer', m).appendChild(el);
  }
  back.appendChild(m); back.hidden = false;
  document.addEventListener('keydown', onKey);
  back.onmousedown = e => { if (e.target === back) close(); };
  if (onOpen) onOpen(m);
  const first = $('input:not([type=radio]):not([type=checkbox]):not([type=datetime-local]),textarea', m); if (first) first.focus();
  return { el: m, close };
}
function ask(title, fields, okLabel = 'OK') {
  return new Promise(resolve => {
    const body = fields.map((f, i) => f.type === 'checkbox'
      ? `<label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-i="${i}" ${f.value ? 'checked' : ''}> ${esc(f.label)}</label>`
      : `<label class="field"><span>${esc(f.label)}</span>${f.multiline ? `<textarea data-i="${i}" rows="3">${esc(f.value || '')}</textarea>` : `<input type="text" data-i="${i}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}">`}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</label>`).join('');
    let done = false;
    const m = openModal({ title, body, buttons: [
      { label: 'Cancel', action: () => { done = true; resolve(null); } },
      { label: okLabel, primary: true, action: (el) => { done = true; resolve(fields.map((f, i) => { const inp = $(`[data-i="${i}"]`, el); return f.type === 'checkbox' ? inp.checked : inp.value; })); } }
    ]});
    $$('input[type=text]', m.el).forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('footer button.primary', m.el).click(); } }));
    const obs = new MutationObserver(() => { if ($('#modalBack').hidden && !done) { done = true; resolve(null); obs.disconnect(); } });
    obs.observe($('#modalBack'), { attributes: true });
  });
}

/* ------------------------------------------------------------------ posts list */
async function refreshList() {
  const r = await api('/api/posts');
  state.posts = r.posts || []; state.postsDir = r.postsDir;
  renderList();
}
function statusBadge(p) {
  if (!p.wpStatus) return '<span class="badge">Local only</span>';
  const label = { publish: 'Published', draft: 'WP draft', pending: 'Pending', private: 'Private', future: 'Scheduled' }[p.wpStatus] || p.wpStatus;
  let h = `<span class="badge ${esc(p.wpStatus)}"${p.wpStatus === 'future' && p.scheduled ? ` title="Goes live ${esc(fmtWhen(p.scheduled))}"` : ''}>${esc(label)}${p.wpStatus === 'future' && p.scheduled ? ' ' + esc(fmtDate(p.scheduled)) : ''}</span>`;
  if (p.published && p.modified && p.modified > p.published) h += '<span class="badge changed">Edited</span>';
  return h;
}
function renderList() {
  const q = $('#search').value.trim().toLowerCase();
  const list = $('#postList');
  const items = state.posts.filter(p => !q || (p.title || '').toLowerCase().includes(q));
  if (!state.posts.length) { list.innerHTML = '<div class="empty-list">No posts yet. Click <b>New post</b> to start writing.</div>'; return; }
  if (!items.length) { list.innerHTML = '<div class="empty-list">No posts match.</div>'; return; }
  list.innerHTML = items.map(p => `<div class="post-item ${state.current && state.current.id === p.id ? 'active' : ''}" data-id="${esc(p.id)}">
      <div class="t">${esc(p.title || 'Untitled')}</div>
      <div class="m">${fmtDate(p.modified)} ${statusBadge(p)}</div></div>`).join('');
}
$('#postList').addEventListener('click', e => { const it = e.target.closest('.post-item'); if (it) openPost(it.dataset.id); });
$('#search').addEventListener('input', renderList);

/* ------------------------------------------------------------------ loading & saving */
async function openPost(id) {
  if (state.current && state.current.id === id) return;
  await flushSave();
  try {
    const r = await api('/api/post?id=' + encodeURIComponent(id));
    state.current = { id: r.id, meta: Object.assign(blankMeta(), r.meta) };
    if (!Array.isArray(state.current.meta.categories)) state.current.meta.categories = state.current.meta.categories == null ? [] : [state.current.meta.categories];
    loadIntoEditor(r.html);
    afterLoad();
  } catch (e) { toast(e.message, 'error'); }
}
async function newPost() {
  await flushSave();
  state.current = { id: null, meta: blankMeta() };
  loadIntoEditor('');
  afterLoad();
  titleEl.focus();
}
function afterLoad() {
  if (state.sourceMode) toggleSource(false);
  titleEl.value = state.current.meta.title || '';
  state.dirty = false;
  setSaveState(state.current.id ? 'Saved' : 'New post');
  renderPanel(); renderList(); updateWordCount(); deselectFig();
  editorWrapScrollTop();
}
function editorWrapScrollTop() { $('#editorWrap').scrollTop = 0; }

function loadIntoEditor(html) {
  editor.innerHTML = html && html.trim() ? html : '<p><br></p>';
  for (const img of $$('img', editor)) {
    const s = img.getAttribute('src') || '';
    if (/^images\//.test(s) && state.current.id) img.setAttribute('src', fileUrl(s));
  }
  for (const f of $$('figure', editor)) f.setAttribute('contenteditable', 'false');
  markFeatured();
  updateEmpty();
}
function serializeEditor() {
  const clone = editor.cloneNode(true);
  for (const img of $$('img', clone)) {
    const m = (img.getAttribute('src') || '').match(/^\/files\/[^/]+\/(images\/[^?#]+)$/);
    if (m) img.setAttribute('src', decodeURIComponent(m[1]));
  }
  for (const el of $$('[contenteditable]', clone)) el.removeAttribute('contenteditable');
  for (const el of $$('.is-selected,.is-featured', clone)) { el.classList.remove('is-selected', 'is-featured'); if (!el.className) el.removeAttribute('class'); }
  const BLOCK = /^(P|H[1-6]|UL|OL|BLOCKQUOTE|PRE|FIGURE|HR|TABLE)$/;
  const out = []; let inline = '';
  const flush = () => { if (inline.replace(/<br>/g, '').trim()) out.push('<p>' + inline.trim() + '</p>'); inline = ''; };
  for (const n of clone.childNodes) {
    if (n.nodeType === 1 && BLOCK.test(n.nodeName)) { flush(); out.push(n.outerHTML); }
    else if (n.nodeType === 1 && n.nodeName === 'DIV') { flush(); if (n.innerHTML.replace(/<br>/g, '').trim()) out.push('<p>' + n.innerHTML + '</p>'); }
    else if (n.nodeType === 1) inline += n.outerHTML;
    else if (n.nodeType === 3) inline += esc(n.textContent);
  }
  flush();
  while (out.length && /^<p>(<br>|\s|&nbsp;)*<\/p>$/.test(out[out.length - 1])) out.pop();
  return out.join('\n');
}
function currentHtml() { return state.sourceMode ? source.value : serializeEditor(); }

async function prepareImage(file) {

$('#imgbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.w) setFigWidth(+b.dataset.w);
  else figAction(b.dataset.img);
});
$('#imgWidth').addEventListener('input', e => setFigWidth(+e.target.value));
function setFigWidth(w) {
  const fig = state.selFig; if (!fig) return;
  fig.style.width = w + '%';
  syncImgbar(); positionImgbar(); markDirty();
}
async function figAction(act) {
  const fig = state.selFig; if (!fig) return;
  if (/^align/.test(act)) {
    fig.classList.remove('alignleft', 'aligncenter', 'alignright', 'alignnone');
    fig.classList.add(act);
    if ((act === 'alignleft' || act === 'alignright') && figWidth(fig) > 60) fig.style.width = '45%';
  } else if (act === 'details') {
    const img = $('img', fig), cap = $('figcaption', fig);
    const res = await ask('Picture details', [
      { label: 'Alt text (describes the picture for screen readers and search engines)', value: img.alt },
      { label: 'Caption (shown under the picture)', value: cap ? cap.textContent : '', multiline: true }
    ], 'Save');
    if (!res) return;
    img.alt = res[0].trim();
    const text = res[1].trim();
    if (text) { let c = cap || document.createElement('figcaption'); c.textContent = text; if (!cap) fig.appendChild(c); }
    else if (cap) cap.remove();
    if (state.selFig !== fig) selectFig(fig);
  } else if (act === 'featured') {
    const rel = figRel(fig);
    state.current.meta.featured = state.current.meta.featured === rel ? '' : rel;
    markFeatured(); renderFeatured();
  } else if (act === 'up') {
    const prev = fig.previousElementSibling; if (prev) prev.before(fig);
  } else if (act === 'down') {
    const next = fig.nextElementSibling; if (next) next.after(fig);
    if (!fig.nextElementSibling) { const p = document.createElement('p'); p.innerHTML = '<br>'; fig.after(p); }
  } else if (act === 'delete') {
    const rel = figRel(fig);
    deselectFig();
    const next = fig.nextElementSibling;
    fig.remove();
    if (rel && rel === state.current.meta.featured) renderFeatured();   // stays featured, just no longer in the body
    if (next) { const r = document.createRange(); r.setStart(next, 0); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    if (!editor.firstChild) editor.innerHTML = '<p><br></p>';
    markDirty(); return;
  }
  syncImgbar(); markDirty();
  requestAnimationFrame(() => { fig.scrollIntoView({ block: 'nearest' }); positionImgbar(); });
}

/* ------------------------------------------------------------------ side panel */
function renderPanel() {
  const m = state.current.meta;
  $('#excerpt').value = m.excerpt || '';
  $('#tags').value = m.tags || '';
  renderCategories(); renderFeatured(); renderWpStatus();
  $('#localInfo').textContent = state.current.id ? (state.postsDir + '\\' + state.current.id) : 'Not saved yet - starts saving as soon as you type.';
  $('#folderInfo').textContent = state.current.id ? 'Saved in ' + state.postsDir + '\\' + state.current.id : '';
  $('#showFolder').disabled = $('#deletePost').disabled = !state.current.id;
}
$('#excerpt').addEventListener('input', e => { state.current.meta.excerpt = e.target.value; markDirty(); });
$('#tags').addEventListener('input', e => { state.current.meta.tags = e.target.value; markDirty(); });
$('#togglePanel').addEventListener('click', () => { $('#panel').classList.toggle('hidden'); positionImgbar(); });

function renderCategories() {
  const box = $('#catList');
  if (!state.categories) {
    box.innerHTML = state.settings && state.settings.hasPassword
      ? '<div class="hint">Click "Reload from WordPress" to load categories.</div>'
      : '<div class="hint">Connect to WordPress in Settings to load categories.</div>';
    return;
  }
  if (!state.categories.length) { box.innerHTML = '<div class="hint">No categories on the site yet.</div>'; return; }
  const sel = new Set((state.current.meta.categories || []).map(Number));
  const byParent = {};
  for (const c of state.categories) (byParent[c.parent || 0] ||= []).push(c);
  const rows = [];
  const walk = (pid, depth) => { for (const c of byParent[pid] || []) { rows.push(`<label class="${depth ? 'child' : ''}" style="padding-left:${depth * 16}px"><input type="checkbox" value="${c.id}" ${sel.has(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`); if (depth < 6) walk(c.id, depth + 1); } };
  walk(0, 0);
  for (const c of state.categories) if (c.parent && !state.categories.some(p => p.id === c.parent)) rows.push(`<label><input type="checkbox" value="${c.id}" ${sel.has(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`);
  box.innerHTML = rows.join('');
}
$('#catList').addEventListener('change', () => {
  state.current.meta.categories = $$('#catList input:checked').map(i => +i.value);
  markDirty();
});
async function loadCategories(showErrors = true) {
  try { const r = await api('/api/categories'); state.categories = r.categories || []; renderCategories(); }
  catch (e) { if (showErrors) toast(e.message, 'error'); }
}
$('#reloadCats').addEventListener('click', () => loadCategories(true));
$('#addCat').addEventListener('click', async () => {
  const name = $('#newCat').value.trim(); if (!name) return;
  try {
    const c = await api('/api/categories', { json: { name } });
    if (!state.categories) state.categories = [];
    if (!state.categories.some(x => x.id === c.id)) state.categories.push(c);
    state.current.meta.categories = [...new Set([...(state.current.meta.categories || []), c.id])];
    $('#newCat').value = ''; renderCategories(); markDirty();
    toast(`Category "${c.name}" created on WordPress.`, 'ok');
  } catch (e) { toast(e.message, 'error'); }
});
function featuredInBody(rel) { return $$('#editor figure').some(fig => figRel(fig) === rel); }
function renderFeatured() {
  const f = state.current.meta.featured, box = $('#featuredBox');
  if (f && state.current.id) {
    const where = featuredInBody(f) ? 'Also used in the post.' : 'Not shown in the post body.';
    box.innerHTML = `<img src="${esc(fileUrl(f))}" alt="Featured image"><div class="fb-note">${where}</div>
      <div class="fb-btns"><button id="changeFeatured">Change...</button><button id="clearFeatured">Remove</button></div>`;
    $('#changeFeatured').onclick = () => $('#featuredPick').click();
    $('#clearFeatured').onclick = () => { state.current.meta.featured = ''; markFeatured(); renderFeatured(); syncImgbar(); markDirty(); };
  } else {
    box.innerHTML = `<div class="fb-note">No featured image yet.</div>
      <div class="fb-btns"><button id="chooseFeatured">Choose image...</button></div>
      <div class="fb-note">Or drop a picture here, or click a picture in your post and choose <b>&#9733; Featured</b>.</div>`;
    $('#chooseFeatured').onclick = () => $('#featuredPick').click();
  }
}
async function setFeaturedFromFile(file) {
  if (!file || !state.current) return;
  if (!/^image\/(jpeg|png|gif|webp)$/.test(file.type)) { toast('Use a JPG, PNG, GIF or WebP picture.', 'error'); return; }
  const box = $('#featuredBox');
  try {
    await ensureSaved();
    box.innerHTML = '<div class="fb-note"><span class="spinner"></span>Adding featured image...</div>';
    const { blob, name } = await prepareImage(file);
    const r = await api(`/api/image?id=${encodeURIComponent(state.current.id)}&name=${encodeURIComponent('featured-' + name.replace(/^featured-/, ''))}`, { body: blob });
    state.current.meta.featured = r.src;
    markFeatured(); syncImgbar(); markDirty();
    toast('Featured image set.', 'ok');
  } catch (e) { toast('Featured image not set: ' + e.message, 'error'); }
  renderFeatured();
}
$('#featuredPick').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; setFeaturedFromFile(f); });
(() => {
  const box = $('#featuredBox');
  box.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); box.classList.add('dragover'); } });
  box.addEventListener('dragleave', () => box.classList.remove('dragover'));
  box.addEventListener('drop', e => {
    box.classList.remove('dragover');
    const f = Array.from(e.dataTransfer.files || []).find(x => x.type.startsWith('image/'));
    if (f) { e.preventDefault(); setFeaturedFromFile(f); }
  });
})();
function siteBase() { return ((state.settings && state.settings.siteUrl) || '').replace(/\/+$/, '').replace(/^(?!https?:\/\/)/, 'https://'); }
function renderWpStatus() {
  const m = state.current.meta, box = $('#wpStatus');
  if (!m.wpId) { box.innerHTML = 'Not sent to WordPress yet.'; return; }
  const label = { publish: 'Published', draft: 'Draft on WordPress', pending: 'Pending review', private: 'Private', future: 'Scheduled' }[m.wpStatus] || m.wpStatus;
  const changed = m.published && m.modified > m.published;
  const when = m.wpStatus === 'future' && m.scheduled ? `<br><span>Goes live <b>${esc(fmtWhen(m.scheduled))}</b></span>` : '';
  box.innerHTML = `<b>${esc(label)}</b> (post #${esc(m.wpId)})${when}<br><span class="hint">Last sent ${esc(fmtDate(m.published))}</span>
    ${changed ? '<div style="color:var(--accent);margin-top:4px">You\'ve made changes since then.</div>' : ''}
    <div class="small-btns"><button data-open="view">View on site</button><button data-open="edit">Open in WP admin</button></div>`;
  $('[data-open="view"]', box).onclick = () => openUrl(m.wpLink);
  $('[data-open="edit"]', box).onclick = () => openUrl(siteBase() + '/wp-admin/post.php?post=' + m.wpId + '&action=edit');
}
function openUrl(u) { if (u) api('/api/openurl?url=' + encodeURIComponent(u)).catch(e => toast(e.message, 'error')); }
$('#showFolder').addEventListener('click', () => { if (state.current.id) api('/api/open?id=' + encodeURIComponent(state.current.id)).catch(e => toast(e.message, 'error')); });
$('#openRoot').addEventListener('click', () => api('/api/open').catch(e => toast(e.message, 'error')));
$('#deletePost').addEventListener('click', () => {
  const cur = state.current; if (!cur.id) return;
  openModal({ title: 'Delete this post?', body: `<p>"<b>${esc(cur.meta.title || 'Untitled')}</b>" and its pictures will be moved to the Windows Recycle Bin.</p>${cur.meta.wpId ? '<p class="hint">The copy on WordPress is not touched.</p>' : ''}`,
    buttons: [{ label: 'Cancel' }, { label: 'Move to Recycle Bin', primary: true, action: async () => {
      try {
        clearTimeout(saveTimer); state.dirty = false;
        await api('/api/delete?id=' + encodeURIComponent(cur.id), { method: 'POST' });
        await refreshList();
        state.current = null;
        if (state.posts.length) await openPost(state.posts[0].id); else await newPost();
        toast('Post moved to the Recycle Bin.');
      } catch (e) { toast(e.message, 'error'); }
    } }] });
});

    pre{background:#f5f5f3;padding:12px;border-radius:6px;white-space:pre-wrap} a{color:#2f5bd3} hr{border:none;border-top:2px solid #ddd;margin:2em 0}

$('#previewBtn').addEventListener('click', () => {
  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox', 'allow-same-origin');
  openModal({ title: 'Preview', body: frame, wide: true, buttons: [{ label: 'Close', primary: true }], onOpen: () => { frame.srcdoc = previewDoc(); } });
});

/* ------------------------------------------------------------------ export to Word */
function exportName() {
  let n = (state.current.meta.title || '').replace(/[^A-Za-z0-9 ._()'&,-]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[^A-Za-z0-9]+/, '').replace(/[ .]+$/, '');
  return (n || 'Untitled').slice(0, 100) + '.docx';
}
$('#exportBtn').addEventListener('click', async () => {
  if (!state.current) return;
  if (state.sourceMode) toggleSource(false);
  deselectFig();
  const btn = $('#exportBtn'), label = btn.textContent;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Exporting...';
  try {
    await ensureSaved(); await flushSave();
    const cur = state.current, m = cur.meta;
    const blob = await window.buildDocx({ title: m.title || 'Untitled', excerpt: m.excerpt, html: currentHtml(), font: prefs.exportFont ? firstFamily(fontStack(prefs.font)) : 'Georgia', resolveSrc: s => /^images\//.test(s) ? fileUrl(s) : s });
    const name = exportName();
    const q = 'id=' + encodeURIComponent(cur.id) + '&name=' + encodeURIComponent(name);
    const r = await api('/api/export?' + q, { body: blob });
    openModal({ title: 'Exported to Word', body: `<p>Saved <b>${esc(r.name)}</b> in this post's folder.</p>
        <p class="hint" style="word-break:break-all">${esc(r.path)}</p>
        <p class="hint">Opens in Microsoft Word. For Google Docs, upload the file to Google Drive, then right-click it and choose <b>Open with &rarr; Google Docs</b>.</p>
        <p class="hint">This is a copy: edits made in Word don't come back into CrowderSphere. Export again any time to refresh it.</p>`,
      buttons: [
        { label: 'Show in folder', action: () => { api('/api/open?id=' + encodeURIComponent(cur.id)).catch(e => toast(e.message, 'error')); } },
        { label: 'Open in Word', primary: true, action: () => { api('/api/openfile?' + q, { method: 'POST' }).catch(e => toast(e.message, 'error')); } }
      ] });
  } catch (e) { toast('Export failed: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = label; }
});

/* ------------------------------------------------------------------ publish */
$('#publishBtn').addEventListener('click', async () => {
  if (!state.current) return;
  if (state.sourceMode) toggleSource(false);
  deselectFig();
  if (!state.settings || !state.settings.siteUrl || !state.settings.hasPassword) {
    openModal({ title: 'Connect to WordPress first', body: '<p>Add your site address, username and an application password in Settings, then come back to send this post.</p>',
      buttons: [{ label: 'Cancel' }, { label: 'Open Settings', primary: true, action: () => { setTimeout(openSettings, 50); } }] });
    return;
  }
  const m = state.current.meta;
  const html = currentHtml();
  const nImgs = (html.match(/src="(\/files\/[^"]+|images\/[^"]+)"/g) || []).length;
  const missingAlt = $$('figure img', editor).filter(i => !i.alt).length;
  const checks = [];
  if (!m.title.trim()) checks.push('<li class="warn">&#9888; The post needs a title.</li>');
  if (!hasContent(html)) checks.push('<li class="warn">&#9888; The post is empty.</li>');
  if (!(m.categories || []).length) checks.push('<li class="warn">&#9888; No category picked (WordPress will use its default).</li>');
  if (!m.featured) checks.push('<li class="warn">&#9888; No featured image.</li>');
  if (missingAlt) checks.push(`<li class="warn">&#9888; ${missingAlt} picture${missingAlt > 1 ? 's have' : ' has'} no alt text.</li>`);
  if (nImgs) checks.push(`<li>&#10003; ${nImgs} picture${nImgs > 1 ? 's' : ''} will be uploaded (only new or changed ones are re-sent).</li>`);
  const isLive = m.wpStatus === 'publish';
  const isSched = m.wpStatus === 'future';
  const host = esc(siteBase().replace(/^https?:\/\//, ''));
  const schedStart = isSched && m.scheduled && new Date(m.scheduled) > new Date() ? new Date(m.scheduled) : defaultScheduleTime();
  const schedOpt = (checked, title, note) => `<label class="radio"><input type="radio" name="st" value="future"${checked ? ' checked' : ''}><div><b>${title}</b><small>${note}</small>
       <div class="sched-pick"><input type="datetime-local" id="schedAt" value="${toLocalInput(schedStart)}" min="${toLocalInput(new Date())}">
         <button type="button" class="quick" data-q="tom8">Tomorrow 8 AM</button><button type="button" class="quick" data-q="sat8">Saturday 8 AM</button></div>
       <small id="schedNote"></small></div></label>`;
  const opts = isLive
    ? `<label class="radio"><input type="radio" name="st" value="publish" checked><div><b>Update the published post</b><small>Changes go live right away.</small></div></label>
       <label class="radio"><input type="radio" name="st" value="draft"><div><b>Switch back to draft</b><small>Takes the post off the site until you publish again.</small></div></label>`
    : isSched
    ? `${schedOpt(true, 'Keep it scheduled', 'Sends your changes and keeps (or moves) the publish time.')}
       <label class="radio"><input type="radio" name="st" value="publish"><div><b>Publish now instead</b><small>The post goes live on ${host} immediately.</small></div></label>
       <label class="radio"><input type="radio" name="st" value="draft"><div><b>Unschedule (back to draft)</b><small>Cancels the scheduled time. Nobody sees it until you publish.</small></div></label>`
    : `<label class="radio"><input type="radio" name="st" value="draft" checked><div><b>Save as a draft on WordPress</b><small>Upload everything, but nobody sees it until you publish.</small></div></label>
       <label class="radio"><input type="radio" name="st" value="publish"><div><b>Publish now</b><small>The post goes live on ${host} immediately.</small></div></label>
       ${schedOpt(false, 'Schedule for later', `WordPress publishes it at the time you pick. Your PC doesn't need to be on.`)}`;
  const body = `${opts}<ul class="check-list">${checks.join('')}</ul><div id="pubResult" style="margin-top:10px"></div>`;
  let finished = false;
  openModal({ title: m.wpId ? 'Update on WordPress' : 'Send to WordPress', body, buttons: [
    { label: 'Close' },
    { label: m.wpId ? 'Send update' : 'Send', primary: true, id: 'pubGo', action: async (el, btn) => {
      if (finished) return true;
      if (!m.title.trim()) { $('#pubResult', el).innerHTML = '<span class="result-bad">Add a title first.</span>'; return false; }
      const status = $('input[name=st]:checked', el).value;
      let scheduleAt = '';
      if (status === 'future') {
        const d = new Date($('#schedAt', el).value);
        if (isNaN(d)) { $('#pubResult', el).innerHTML = '<span class="result-bad">Pick a date and time.</span>'; return false; }
        if (d.getTime() < Date.now() + 90000) { $('#pubResult', el).innerHTML = '<span class="result-bad">Pick a time at least a couple of minutes from now.</span>'; return false; }
        scheduleAt = d.toISOString();
      }
      btn.disabled = true;
      $('#pubResult', el).innerHTML = '<span class="spinner"></span>Saving, uploading pictures and sending the post...';
      try {
        await flushSave();
        const cur = state.current;
        const r = await api('/api/publish', { json: { id: cur.id, status, html: currentHtml(), scheduleAt } });
        Object.assign(cur.meta, { wpId: r.meta.wpId, wpLink: r.meta.wpLink, wpStatus: r.meta.wpStatus, published: r.meta.published, scheduled: r.meta.scheduled || '', modified: r.meta.modified, media: r.meta.media });
        renderWpStatus(); await refreshList();
        finished = true;
        const word = r.meta.wpStatus === 'publish' ? 'Published!'
          : r.meta.wpStatus === 'future' ? 'Scheduled for ' + fmtWhen(r.meta.scheduled) + '.'
          : r.meta.wpStatus === 'pending' ? 'Sent for review (pending).' : 'Saved as a draft on WordPress.';
        $('#pubResult', el).innerHTML = `<span class="result-ok">&#10003; ${word}</span> <a href="#" id="pubView">View it</a>`;
        $('#pubView', el).onclick = ev => { ev.preventDefault(); openUrl(r.meta.wpStatus === 'publish' ? r.meta.wpLink : siteBase() + '/wp-admin/post.php?post=' + r.meta.wpId + '&action=edit'); };
        btn.textContent = 'Done'; btn.disabled = false;
        toast(word, 'ok');
      } catch (e) {
        $('#pubResult', el).innerHTML = `<span class="result-bad">Not sent:</span> ${esc(e.message)}`;
        btn.disabled = false;
      }
      return false;
    } }
  ] });
  const box = $('#modalBack'), at = $('#schedAt', box);
  if (at) {
    const note = () => {
      const d = new Date(at.value);
      $('#schedNote', box).textContent = isNaN(d) ? '' : (d <= new Date() ? 'That time has already passed.' : 'Goes live ' + fmtWhen(d.toISOString()) + ' (your computer\'s time zone).');
    };
    at.addEventListener('input', note);
    at.addEventListener('focus', () => { $('input[name=st][value=future]', box).checked = true; });
    $$('.quick', box).forEach(b => b.addEventListener('click', ev => {
      ev.preventDefault();
      const d = defaultScheduleTime();
      if (b.dataset.q === 'sat8') { d.setDate(d.getDate() - 1); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); }
      at.value = toLocalInput(d); $('input[name=st][value=future]', box).checked = true; note();
    }));
    note();
  }
});

      <label class="field"><span>Zoom</span><select id="pZoom">${[50,60,70,80,90,100,110,120,130,140,150,175,200,250].map(n => `<option value="${n / 100}">${n}%</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>Writing font</span><select id="pFont">${FONTS.map(f => `<option value="${esc(f[0])}" style="font-family:${esc(f[1])}">${esc(f[0])}</option>`).join('')}</select>
      <div class="hint">How text looks while you write. Your WordPress theme decides the font on your site, unless you change it for selected text with the font menu in the toolbar.</div></label>
    <label class="field" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pExport"> Use the writing font in Word exports</label>
    <label class="field" style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><input type="checkbox" id="pSpell"> Check spelling as I type</label>
    <div class="hint" style="margin-bottom:12px">Misspelled words get a red underline. Right-click one for suggestions or "Add to dictionary". Spelling languages, and Microsoft Editor grammar checking, are set in Edge under Settings &rarr; Languages.</div>
    <div class="hint" style="text-align:right">CrowderSphere ${esc(s.version || '')}</div>`;
  const before = Object.assign({}, prefs);
  let saved = false;
  const readPrefs = el => ({ theme: $('#pTheme', el).value, font: $('#pFont', el).value, fontSize: +$('#pSize', el).value, pageWidth: $('#pWidth', el).value, zoom: +$('#pZoom', el).value, exportFont: $('#pExport', el).checked, spellcheck: $('#pSpell', el).checked });
  const collect = el => ({ siteUrl: $('#sSite', el).value.trim(), username: $('#sUser', el).value.trim(), appPassword: $('#sPass', el).value, postsDir: $('#sDir', el).value.trim(), maxImageWidth: +$('#sMax', el).value || 1920, prefs: readPrefs(el) });
  const saveIt = async el => {
    const beforeDir = state.settings && state.settings.postsDir;
    const data = collect(el);
    state.settings = await api('/api/settings', { json: data });
    prefs = Object.assign({}, prefs, data.prefs); cachePrefs(); applyPrefs(); saved = true;
    $('#sPass', el).value = ''; $('#sPass', el).placeholder = state.settings.hasPassword ? 'Saved (leave blank to keep it)' : '';
    if (beforeDir !== state.settings.postsDir) { await flushSave(); state.current = null; await refreshList(); if (state.posts.length) await openPost(state.posts[0].id); else await newPost(); }
  };
  openModal({ title: 'Settings', body, buttons: [
    { label: 'Cancel' },
    { label: 'Save', primary: true, action: async el => { try { await saveIt(el); state.categories = null; renderCategories(); if (state.settings.hasPassword) loadCategories(false); toast('Settings saved.', 'ok'); } catch (e) { toast(e.message, 'error'); return false; } } }
  ], onClose: () => { if (!saved) { prefs = before; applyPrefs(); } }, onOpen: el => {
    $('#pTheme', el).value = prefs.theme; $('#pFont', el).value = prefs.font; $('#pSize', el).value = String(prefs.fontSize);
    $('#pExport', el).checked = !!prefs.exportFont; $('#pSpell', el).checked = !!prefs.spellcheck;
    $('#pWidth', el).value = prefs.pageWidth || 'fill';
    const zSel = $('#pZoom', el), zv = +prefs.zoom || 1;
    if (![...zSel.options].some(o => +o.value === zv)) zSel.insertAdjacentHTML('beforeend', `<option value="${zv}">${Math.round(zv * 100)}%</option>`);
    zSel.value = String(zv);
    for (const id of ['#pTheme', '#pFont', '#pSize', '#pWidth', '#pZoom', '#pExport', '#pSpell']) $(id, el).addEventListener('change', () => { prefs = Object.assign({}, prefs, readPrefs(el)); applyPrefs(); });
    $('#sTest', el).onclick = async () => {
      const res = $('#sTestRes', el);
      res.innerHTML = '<span class="spinner"></span>Connecting...';
      try {
        await saveIt(el);
        const r = await api('/api/test', { method: 'POST' });
        res.innerHTML = `<span class="result-ok">&#10003; Connected as ${esc(r.name)}</span>` + (r.canPublish ? '' : ' <span class="result-bad">(this account can\'t publish - posts will go in as pending)</span>');
        loadCategories(false);
      } catch (e) { res.innerHTML = `<span class="result-bad">${esc(e.message)}</span>`; }
    };
    $('#sBrowse', el).onclick = async () => {
      try { const r = await api('/api/browse?start=' + encodeURIComponent($('#sDir', el).value), { method: 'POST' }); if (r.path) $('#sDir', el).value = r.path; }
      catch (e) { toast(e.message, 'error'); }
    };
  } });
}
$('#openSettings').addEventListener('click', openSettings);
$('#themeBtn').addEventListener('click', () => savePrefs({ theme: isDark() ? 'light' : 'dark' }));
$('#newPost').addEventListener('click', newPost);

/* ------------------------------------------------------------------ keyboard, lifecycle */
document.addEventListener('keydown', e => {
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); if (state.current) { state.dirty = true; save(); } }
  if (e.ctrlKey && e.key.toLowerCase() === 'k' && editor.contains(document.activeElement || editor)) { e.preventDefault(); insertLink(); }
  if (e.ctrlKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newPost(); }
});
setInterval(() => { api('/api/heartbeat', { method: 'POST' }).catch(() => {}); }, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && state.dirty) save(); });
addEventListener('pagehide', () => {
  if (state.dirty && state.current && state.current.id) {
    const m = state.current.meta;
    try { fetch('/api/post', { method: 'POST', keepalive: true, headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify({ id: state.current.id, html: currentHtml(), meta: { title: m.title, excerpt: m.excerpt, categories: m.categories, tags: m.tags, featured: m.featured } }) }); } catch (e) {}
  }
  navigator.sendBeacon('/api/bye?t=' + TOKEN, '');
});

let wasNarrow = innerWidth < 1000;
addEventListener('resize', () => {
  const narrow = innerWidth < 1000;
  if (narrow && !wasNarrow) $('#panel').classList.add('hidden');
  wasNarrow = narrow;
});
$('#panelClose').addEventListener('click', () => { $('#panel').classList.add('hidden'); });
(async function init() {
  if (innerWidth < 1000) $('#panel').classList.add('hidden');
  try {
    await loadSettings();
    if (state.settings.prefs && Object.keys(state.settings.prefs).length) { prefs = Object.assign({}, DEFAULT_PREFS, state.settings.prefs); cachePrefs(); applyPrefs(); }
    await refreshList();
    if (state.posts.length) await openPost(state.posts[0].id); else await newPost();
    if (!state.settings.siteUrl || !state.settings.hasPassword) setTimeout(() => toast('Tip: open Settings to connect your WordPress site.'), 800);
    else { loadCategories(false); syncScheduled(); setInterval(syncScheduled, 5 * 60 * 1000); }
  } catch (e) { toast(e.message, 'error'); }
})();
// Scheduled posts go live on WordPress by themselves; catch the list up once their time has passed
async function syncScheduled() {
  if (!state.posts.some(p => p.wpStatus === 'future')) return;
  try {
    const r = await api('/api/sync-scheduled', { json: {} });
    if (!(r.changed || []).length) return;
    await refreshList();
    if (state.current && r.changed.includes(state.current.id)) {
      const p = state.posts.find(x => x.id === state.current.id);
      if (p) { Object.assign(state.current.meta, { wpStatus: p.wpStatus, wpLink: p.wpLink, scheduled: p.scheduled || '' }); renderWpStatus(); }
    }
    const live = r.changed.filter(id => (state.posts.find(x => x.id === id) || {}).wpStatus === 'publish').length;
    toast(live ? (live === 1 ? 'A scheduled post just went live.' : live + ' scheduled posts just went live.') : 'Updated scheduled posts from WordPress.', 'ok');
  } catch (e) { /* offline or WordPress unreachable: try again later */ }
}
</script>
